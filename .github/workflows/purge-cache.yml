name: Purge production cache

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Pages production deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?set CLOUDFLARE_ACCOUNT_ID}"
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/unbridled/deployments?env=production"
          for _ in $(seq 1 40); do
            payload=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url")
            status=$(printf '%s' "$payload" | jq -r --arg sha "$GITHUB_SHA" '
              [.result[]
                | select(.deployment_trigger.metadata.commit_hash == $sha)
                | .latest_stage.status] | first // empty
            ')
            case "$status" in
              success) echo "pages production deploy is live"; exit 0 ;;
              failure|canceled) echo "pages deploy ${status}"; exit 1 ;;
            esac
            sleep 5
          done
          echo "timed out waiting for pages deploy ${GITHUB_SHA}"
          exit 1

      - name: Purge unbridled.max.horse
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ZONE_ID:?set CLOUDFLARE_ZONE_ID}"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["unbridled.max.horse"]}'
          echo
          echo "purged unbridled.max.horse"
